name: "🐛 Bug Report"
description: Create a new ticket for a bug.
title: "🐛 [BUG] - <title>"
labels: [
  "bug"
]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: Please enter an explicit description of your issue (SEARCH FOR EXISTING ISSUES FIRST). Also check [StreamLabs known issues](https://support.streamlabs.com/hc/en-us/categories/27279811363227-Known-Issues)
      placeholder: Short and explicit description of your incident...
    validations:
      required: true
  - type: textarea
    id: reprod
    attributes:
      label: "Reproduction steps"
      description: Please enter an explicit description of your issue
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      render: bash
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshots"
      description: If applicable, add screenshots to help explain your problem.
      value: |
        ![DESCRIPTION](LINK.png)
      render: bash
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: "Token check"
      description: "Your Streamlabs token can start and stop live streams on your TikTok account. See SECURITY.md."
      options:
        - label: "I have not included my Streamlabs token, my stream key, or a screenshot showing them."
          required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: |
        Paste the application log, which you can open with the "Logs" button. It contains no tokens,
        authorization codes or stream keys. If you paste anything else (console output, config.json),
        remove your token and stream key first.
      render: bash
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: "OS"
      description: What is the impacted environment ?
      multiple: true
      options:
        - Windows
        - Linux
        - Mac
    validations:
      required: false