name: "🐛 Informe de error"
description: Crear un informe para describir un error.
title: "🐛 [BUG] - <título>"
labels: [
  "bug"
]
body:
  - type: textarea
    id: description
    attributes:
      label: "Descripción"
      description: Explica el problema con el mayor detalle posible (BUSCA ANTES SI YA EXISTE UN ISSUE ABIERTO). Consulta también los [problemas conocidos de Streamlabs](https://support.streamlabs.com/hc/en-us/categories/27279811363227-Known-Issues)
      placeholder: Descripción breve y concreta de lo que te ha pasado...
    validations:
      required: true
  - type: textarea
    id: reprod
    attributes:
      label: "Pasos para reproducirlo"
      description: Indica los pasos exactos que hiciste
      value: |
        1. Abro la aplicación
        2. Pulsa '...'
        3. Aparece el error
      render: bash
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: "Capturas de pantalla"
      description: "Si viene al caso, añade capturas. OJO: tapa tu token y tu clave de retransmisión."
      value: |
        ![DESCRIPCIÓN](ENLACE.png)
      render: bash
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: "Comprobación de secretos"
      description: "Tu token de Streamlabs puede abrir y cerrar directos en tu cuenta de TikTok. Lee SECURITY.md antes de publicar."
      options:
        - label: "No he incluido mi token de Streamlabs, ni mi clave de retransmisión, ni capturas donde se vean."
          required: true
  - type: textarea
    id: logs
    attributes:
      label: "Registros"
      description: |
        Pega el registro de la aplicación, que puedes abrir con el botón "Registros". No contiene
        tokens, códigos de autorización ni claves de retransmisión. Si pegas cualquier otra cosa
        (salida de consola, config.json), borra antes tu token y tu clave.
      render: bash
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: "Sistema operativo"
      description: ¿Dónde te ha pasado?
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
