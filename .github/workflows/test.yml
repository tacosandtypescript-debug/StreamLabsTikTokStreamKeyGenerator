name: Tests

on:
  push:
  pull_request:
  # Reused by release.yml so the matrix is defined in exactly one place.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    env:
      # Importing the GUI module must never require a real display.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libsecret-1-0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      # The installers are run straight from a URL, so a typo would reach users
      # before anything else could catch it. Check their syntax here.
      - name: Check install.sh syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh

      - name: Check install.ps1 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "::error::linea $($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1: sintaxis correcta"

      - name: Run tests
        run: pytest

      # A brand new CVE in a dependency must not freeze the release pipeline,
      # so the audit is reported without failing the job. Remove
      # continue-on-error to make it blocking again.
      - name: Audit dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt
