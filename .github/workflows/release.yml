name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version number (e.g., 2.0.10)"
        required: true
      changelog:
        description: "The changelog for this version"
        required: true

env:
  FORCE_COLOR: true

permissions:
  contents: read

jobs:
  # Single source of truth for the test matrix: the release cannot start
  # unless the reusable Tests workflow succeeds.
  test:
    uses: ./.github/workflows/test.yml

  create-tag:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Git Tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "The release tag already exists: v$RELEASE_VERSION" >&2
            exit 1
          fi
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

  build_windows:
    runs-on: windows-latest
    needs: [create-tag, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          "__version__ = '${{ github.event.inputs.version }}'" | Out-File -FilePath _version.py -Encoding utf8

      - name: Build Executable
        run: |
          nuitka `
          --assume-yes-for-downloads `
          --show-scons `
          --clang `
          --lto=yes `
          --jobs=4 `
          --static-libpython=no `
          --standalone `
          --enable-plugin=anti-bloat `
          --show-modules `
          --show-anti-bloat-changes `
          --follow-stdlib `
          --follow-imports `
          --nofollow-import-to="*.tests" `
          --nofollow-import-to="pydoc" `
          --nofollow-import-to="test" `
          --prefer-source-code `
          --include-module=unittest `
          --include-package=keyring.backends `
          --include-package=win32ctypes `
          --windows-console-mode=disable `
          --enable-plugin=pyside6 `
          --windows-company-name="Loukious" `
          --windows-product-name="StreamLabs TikTok Stream Key Generator" `
          --windows-file-version="${{ github.event.inputs.version }}" `
          --windows-product-version="${{ github.event.inputs.version }}" `
          --windows-file-description="StreamLabs TikTok Stream Key Generator" `
          --copyright="Copyright © 2026 Loukious" `
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: Compress-Archive -Path StreamLabsTikTokStreamKeyGenerator.dist\* -DestinationPath StreamLabsTikTokStreamKeyGenerator-win-${{ github.event.inputs.version }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.zip

  build_macos:
    runs-on: macos-latest
    needs: [create-tag, test]
    strategy:
      matrix:
        architecture: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          echo "__version__ = '${{ github.event.inputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          arch -${{ matrix.architecture }} nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --include-package=keyring.backends \
          --prefer-source-code \
          --macos-target-arch=${{ matrix.architecture }} \
          --macos-create-app-bundle \
          --macos-app-version="${{ github.event.inputs.version }}" \
          --macos-app-name="StreamLabs TikTok Stream Key Generator" \
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: |
          zip -r StreamLabsTikTokStreamKeyGenerator-${{ matrix.architecture }}-macos-${{ github.event.inputs.version }}.zip StreamLabsTikTokStreamKeyGenerator.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            *.zip

  build_linux:
    runs-on: ubuntu-22.04
    needs: [create-tag, test]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3-pip zip python3-distutils
          python3 -m pip install --upgrade pip
          pip3 install -r requirements-build.txt
          echo "__version__ = '${{ github.event.inputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --include-package=keyring.backends \
          --include-package=secretstorage \
          --include-package=jeepney \
          --show-modules \
          --show-anti-bloat-changes \
          --follow-stdlib \
          --follow-imports \
          --prefer-source-code \
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: zip -r StreamLabsTikTokStreamKeyGenerator-linux-${{ github.event.inputs.version }}.zip StreamLabsTikTokStreamKeyGenerator.dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.zip

  release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows, build_macos]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # The README tells users to verify a checksum, so one has to exist.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum | sed 's|\./||' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.changelog }}
          files: |
            artifacts/**/*.zip
            SHA256SUMS.txt
