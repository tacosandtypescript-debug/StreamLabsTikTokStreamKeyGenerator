name: Release

# Two ways to publish:
#   * push a version tag:      git tag v2.0.10 && git push origin v2.0.10
#     -> compiles Windows/macOS/Linux and publishes, with generated notes.
#   * manual run from the Actions tab, with your own version and changelog.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version number (e.g., 2.0.10)"
        required: true
      changelog:
        description: "The changelog for this version"
        required: true
  push:
    tags:
      - "v*"

env:
  FORCE_COLOR: true

permissions:
  contents: read

jobs:
  # Single source of truth for the test matrix; nothing is built unless it passes.
  test:
    uses: ./.github/workflows/test.yml

  resolve-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changelog: ${{ steps.resolve.outputs.changelog }}
      from_tag: ${{ steps.resolve.outputs.from_tag }}
    steps:
      - name: Resolve the version and the changelog
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            from_tag="false"
          else
            version="${REF_NAME#v}"
            from_tag="true"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH, got: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "from_tag=$from_tag"
            echo "changelog<<__CHANGELOG__"
            echo "$INPUT_CHANGELOG"
            echo "__CHANGELOG__"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (from tag: $from_tag)"

  create-tag:
    needs: [resolve-version, test]
    # Only the manual flow creates the tag; a tag push already has one.
    if: ${{ needs.resolve-version.outputs.from_tag != 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Git Tag
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "The release tag already exists: v$RELEASE_VERSION" >&2
            exit 1
          fi
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

  build_windows:
    runs-on: windows-latest
    needs: [resolve-version, create-tag, test]
    if: ${{ always() && needs.test.result == 'success' && needs.resolve-version.result == 'success' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          "__version__ = '${{ needs.resolve-version.outputs.version }}'" | Out-File -FilePath _version.py -Encoding utf8

      - name: Build Executable
        run: |
          nuitka `
          --assume-yes-for-downloads `
          --show-scons `
          --clang `
          --lto=yes `
          --jobs=4 `
          --static-libpython=no `
          --standalone `
          --enable-plugin=anti-bloat `
          --show-modules `
          --show-anti-bloat-changes `
          --follow-stdlib `
          --follow-imports `
          --nofollow-import-to="*.tests" `
          --nofollow-import-to="pydoc" `
          --nofollow-import-to="test" `
          --prefer-source-code `
          --include-module=unittest `
          --include-package=keyring.backends `
          --include-package=win32ctypes `
          --windows-console-mode=disable `
          --enable-plugin=pyside6 `
          --windows-company-name="Loukious" `
          --windows-product-name="StreamLabs TikTok Stream Key Generator" `
          --windows-file-version="${{ needs.resolve-version.outputs.version }}" `
          --windows-product-version="${{ needs.resolve-version.outputs.version }}" `
          --windows-file-description="StreamLabs TikTok Stream Key Generator" `
          --copyright="Copyright © 2026 Loukious" `
          --windows-icon-from-ico="assets/icon.ico" `
          --include-data-dir="assets=assets" `
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: Compress-Archive -Path StreamLabsTikTokStreamKeyGenerator.dist\* -DestinationPath StreamLabsTikTokStreamKeyGenerator-win-${{ needs.resolve-version.outputs.version }}.zip

      # Inno Setup 6 is preinstalled on the runner, but its path is not
      # documented, so it is resolved instead of hard-coded.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw 'ISCC.exe not found: Inno Setup is missing on this runner' }
          & $iscc "/DMyAppVersion=${{ needs.resolve-version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem -Path Output | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.zip
            Output/*.exe

  build_macos:
    runs-on: macos-latest
    needs: [resolve-version, create-tag, test]
    if: ${{ always() && needs.test.result == 'success' && needs.resolve-version.result == 'success' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') }}
    strategy:
      matrix:
        architecture: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          echo "__version__ = '${{ needs.resolve-version.outputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          arch -${{ matrix.architecture }} nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --include-package=keyring.backends \
          --prefer-source-code \
          --macos-target-arch=${{ matrix.architecture }} \
          --macos-create-app-bundle \
          --macos-app-version="${{ needs.resolve-version.outputs.version }}" \
          --macos-app-name="StreamLabs TikTok Stream Key Generator" \
          --macos-app-icon="assets/icon.icns" \
          --include-data-dir="assets=assets" \
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: |
          zip -r StreamLabsTikTokStreamKeyGenerator-${{ matrix.architecture }}-macos-${{ needs.resolve-version.outputs.version }}.zip StreamLabsTikTokStreamKeyGenerator.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            *.zip

  build_linux:
    runs-on: ubuntu-22.04
    needs: [resolve-version, create-tag, test]
    if: ${{ always() && needs.test.result == 'success' && needs.resolve-version.result == 'success' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3-pip zip python3-distutils
          python3 -m pip install --upgrade pip
          pip3 install -r requirements-build.txt
          echo "__version__ = '${{ needs.resolve-version.outputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --include-package=keyring.backends \
          --include-package=secretstorage \
          --include-package=jeepney \
          --show-modules \
          --show-anti-bloat-changes \
          --follow-stdlib \
          --follow-imports \
          --prefer-source-code \
          --include-data-dir="assets=assets" \
          StreamLabsTikTokStreamKeyGenerator.py

      - name: Compress Executable
        run: zip -r StreamLabsTikTokStreamKeyGenerator-linux-${{ needs.resolve-version.outputs.version }}.zip StreamLabsTikTokStreamKeyGenerator.dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.zip

  release:
    runs-on: ubuntu-latest
    needs: [resolve-version, build_linux, build_windows, build_macos]
    if: ${{ !cancelled() && needs.build_windows.result == 'success' && needs.build_macos.result == 'success' && needs.build_linux.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # The README tells users to verify a checksum, so one has to exist. Only
      # the bare file name is written, so "sha256sum -c SHA256SUMS.txt" works
      # for a user who drops the downloaded ZIPs in a single folder.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.zip' -o -name '*.exe' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
          done > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      # winget stores manifests, never installers, so the hash of the installer
      # that was just built is baked in here instead of being copied by hand.
      # Read winget/README.md before opening the pull request.
      - name: Generate winget manifests
        run: |
          installer="$(find artifacts/windows -name 'Setup-*.exe' | head -n1)"
          python3 tools/make_winget_manifest.py \
            --installer "$installer" \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --output winget-out
          (cd winget-out && zip -qr ../winget-manifests.zip .)
          unzip -l winget-manifests.zip

      - name: Create the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ needs.resolve-version.outputs.version }}"
          body: ${{ needs.resolve-version.outputs.changelog }}
          generate_release_notes: ${{ needs.resolve-version.outputs.from_tag == 'true' }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            SHA256SUMS.txt
            winget-manifests.zip
